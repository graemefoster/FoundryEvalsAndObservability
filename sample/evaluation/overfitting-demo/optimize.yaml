# NARROW DEMO SET: reproduces the overfitting run from 11 Oct 2026. Eight near-identical dinner
# questions make memorising the cheapest win; the holdout (golden-holdout) catches it.
# For a fair optimisation run, use evaluation/optimize.yaml instead.
# Run from sample/: azd ai agent optimize --config evaluation/overfitting-demo/optimize.yaml
# Keep the latest deployed agent aligned with the local baseline before submitting.
# 4 things - agent, dataset, holdout, and evaluators must be specified.
name: purchasing-storyline-optimisation
agent:
  name: purchasing-advice-demo
  kind: hosted
  model: gpt-5.4-mini
  config: ../agent/.agent_configs/baseline/metadata.yaml
# azd resolves dataset paths from the service's project directory: sample/agent/.
dataset:
  local_uri: ../evaluation/overfitting-demo/demo-storyline.jsonl
validation_dataset:
  local_uri: ../evaluation/overfitting-demo/golden-holdout.jsonl
evaluators:
  - name: purchasing-next-action
    initialization_parameters:
      deployment_name: gpt-5.5
      threshold: 1
  - name: purchasing-demo-rubric
    initialization_parameters:
      model: gpt-5.5
options:
  eval_model: gpt-5.5
  optimization_model: gpt-5.5
  max_candidates: 2
# Holdout cases go to native validation, never into the training dataset.
# No model_search_space: the agent model is fixed.
# Native optimisation can change instructions and tool descriptions, not Python tools.
# Optimise with binary next-action correctness and weighted rubric quality.
# Both judges request behaviour-only feedback; neither is a documented hard selection gate.
