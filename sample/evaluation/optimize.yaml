# From sample/: azd ai agent optimize --config evaluation/optimize.yaml
# Keep the latest deployed agent aligned with the local baseline before submitting.
#
# "Who approves this, today?" scenario, built so a general method wins and memorising loses:
# - Training and validation use different departments, people and dates
#   (generated by evaluation/generate_approver_data.py), so a name or date copied from a
#   training question can't help on a validation question.
# - The fix the baseline needs is behaviour: look up the employee's line manager in Work IQ,
#   check leave and recorded delegations on the decision date, ignore informal shortcuts,
#   answer first.
# - Every row carries fact-free criteria; reference answers are computed from the roster.
# After the run, check the winner with evaluation/check_prompt_facts.py before promoting it.
name: purchasing-approver-optimisation
agent:
  name: purchasing-advice-demo
  kind: hosted
  model: gpt-5.4-mini
  config: ../agent/.agent_configs/baseline/metadata.yaml
# azd resolves dataset paths from the service's project directory: sample/agent/.
dataset:
  local_uri: ../evaluation/datasets/approvers-development.jsonl
validation_dataset:
  local_uri: ../evaluation/datasets/approvers-holdout.jsonl
evaluators:
  - name: purchasing-next-action
    initialization_parameters:
      deployment_name: gpt-5.5
      threshold: 1
  - name: purchasing-demo-rubric
    initialization_parameters:
      model: gpt-5.5
options:
  eval_model: gpt-5.5
  optimization_model: gpt-5.5
  # More rounds than before, so a winning change can be built on. Expect ~10-15 min each.
  max_candidates: 4
# No model_search_space: the agent model is fixed.
# The drift set (approvers-drift.jsonl) is never given to the optimiser.
