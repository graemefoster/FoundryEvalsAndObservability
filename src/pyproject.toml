[project]
name = "ai-genius-purchasing-agent"
version = "0.1.0"
description = "One small purchasing advice agent for five Foundry demonstrations."
requires-python = ">=3.13,<3.14"
dependencies = [
    "agent-framework-foundry",
    "agent-framework-foundry-hosting>=1.0.0b260813",
    "azure-ai-agentserver-optimization==1.0.0b1",
    "azure-identity>=1.25.0,<2",
]

[dependency-groups]
dev = [
    "azure-ai-projects>=2.4.0,<3",
    "openai>=2.54.0,<3",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.15,<1",
    "pyyaml>=6,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["agent", "."]
addopts = "-q"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
