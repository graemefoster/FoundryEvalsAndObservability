name: Agent release

# Releasing: the drift set (the "surprise exam") must pass, then a person approves.
# Only scores and failed-row counts are published, never which questions failed,
# so the set doesn't quietly become something people tune against.
on:
  workflow_dispatch:
    inputs:
      write_baseline:
        description: Save this run as the drift baseline (no release)
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: purchasing-demo-deployment
  cancel-in-progress: false

jobs:
  drift:
    name: Drift set (must pass)
    uses: ./.github/workflows/_agent-eval.yml
    permissions:
      contents: read
      id-token: write
    with:
      dataset: approvers-drift
      tolerance: 0.03
      must_pass: next_action_success
      max_unscored: 0  # every drift question must be scored, as well as passed
      blocking: true
      detail: counts
      write_baseline: ${{ github.event_name == 'workflow_dispatch' && inputs.write_baseline }}

  approve:
    name: Release approval
    needs: drift
    # The first release sets the drift bar and still had to pass every must-pass question.
    # A run with write_baseline ticked only records a new bar: no release.
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.write_baseline) }}
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to 26 from 19 Oct 2026
    # Add required reviewers to the "production" environment in the repo settings.
    environment: production
    steps:
      - name: Record the release
        run: |
          {
            echo "## Released"
            echo "Revision \`${GITHUB_SHA}\` passed the drift set and was approved."
            echo "Demo note: there is one Foundry project, so the drift job's deploy is the"
            echo "release. With a separate production project, deploy to it here."
          } >> "$GITHUB_STEP_SUMMARY"
