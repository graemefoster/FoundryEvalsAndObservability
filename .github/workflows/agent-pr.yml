name: Agent PR gate

# Every pull request: cheapest checks first.
#   1. Offline: lint, the evaluation request, and the prompt fact check (seconds, no Azure).
#   2. Development set against the baseline from the PR's base revision.
# The drift set never runs here; it is kept for releases so it stays a surprise exam.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      write_baseline:
        description: Save this run as the development baseline
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  offline:
    name: 1. Offline checks
    outputs:
      evaluate: ${{ steps.scope.outputs.evaluate }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: sample
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Decide whether cloud evaluation is needed
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          evaluate=true
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
              echo "::error::Missing PR comparison revisions; cannot safely skip evaluation."
              exit 1
            fi
            git diff --no-renames --name-only -z "${BASE_SHA}...${HEAD_SHA}" -- \
              > "$RUNNER_TEMP/pr-evaluation-paths"
            evaluate=false
            while IFS= read -r -d '' path; do
              case "$path" in
                presentation/*|PLAYBOOK.md) ;;
                *) evaluate=true; break ;;
              esac
            done < "$RUNNER_TEMP/pr-evaluation-paths"
          fi
          echo "evaluate=$evaluate" >> "$GITHUB_OUTPUT"
          if [ "$evaluate" = "true" ]; then
            echo "Cloud evaluation required: agent-affecting or unclassified changes, or manual run."
          else
            echo "Cloud evaluation skipped: only presentation or playbook changes." \
              >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.11"
          python-version: "3.13"
          working-directory: sample
      - name: Install pinned dependencies
        run: |
          uv venv
          uv pip install --require-hashes -r agent/requirements.txt -r requirements-dev.txt
      - name: Lint and format
        run: |
          .venv/bin/ruff check agent evaluation
          .venv/bin/ruff format --check agent evaluation
      - name: Check evaluation request without Azure
        run: .venv/bin/python evaluation/evaluate.py --dry-run > /dev/null
      - name: Facts in the prompt
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p /tmp/base-config
          for f in instructions.md tools.json; do
            git show "origin/${GITHUB_BASE_REF}:sample/agent/.agent_configs/baseline/$f" \
              > "/tmp/base-config/$f"
          done
          python3 evaluation/check_prompt_facts.py \
            --baseline /tmp/base-config \
            --candidate agent/.agent_configs/baseline \
            --data agent/data/*.json

  development:
    name: 2. Development set vs baseline
    needs: offline
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository ||
      needs.offline.outputs.evaluate == 'false'
    uses: ./.github/workflows/_agent-eval.yml
    permissions:
      contents: read
      id-token: write
    with:
      run_evaluation: ${{ needs.offline.outputs.evaluate == 'true' }}
      agent_name: ${{ format('purchasing-advice-demo-pr-{0}', github.event.pull_request.number || github.run_id) }}
      dataset: approvers-development
      # With 34 rows, the noise band allows two binary outcomes to change.
      tolerance: 0.07
      blocking: true
      detail: full
      write_baseline: ${{ github.event_name == 'workflow_dispatch' && inputs.write_baseline }}
