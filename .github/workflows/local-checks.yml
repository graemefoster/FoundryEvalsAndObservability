name: Python and offline evaluation checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sample
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.12.11"
          python-version: "3.13"
          working-directory: sample
      - name: Install pinned dependencies
        run: |
          uv venv
          uv pip install --require-hashes -r agent/requirements.txt -r requirements-dev.txt
      - name: Check Python formatting without Azure
        run: |
          .venv/bin/ruff check agent evaluation
          .venv/bin/ruff format --check agent evaluation
      - name: Check evaluation request without Azure
        run: .venv/bin/python evaluation/evaluate.py --dry-run > /dev/null
