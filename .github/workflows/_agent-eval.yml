name: Evaluate agent (reusable)

# Shared by the PR gate and main promotion workflow.
# Deploys the checked-out agent, runs one dataset through the judges, then either
# compares with a stored baseline or saves this run as the new baseline.
on:
  workflow_call:
    inputs:
      run_evaluation:
        description: False skips the required evaluation job for presentation/playbook-only PRs
        type: boolean
        default: true
      agent_name:
        description: Foundry agent to deploy and evaluate
        type: string
        required: true
      deploy_agent:
        description: Deploy before evaluating (false reuses the tested dev deployment)
        type: boolean
        default: true
      dataset:
        description: JSONL file under sample/evaluation/datasets/
        type: string
        required: true
      tolerance:
        description: Allowed drop in each evaluator's mean score before failing.
        type: number
        default: 0.03
      must_pass:
        description: Space-separated evaluators where any failed row blocks.
        type: string
        default: ""
      blocking:
        description: Fail the job on a regression (false = report only).
        type: boolean
        default: true
      detail:
        description: "full = publish the Foundry report link; counts = scores only (for the drift set)."
        type: string
        default: full
      max_unscored:
        description: Questions each judge may fail to score (e.g. a rate limit) before the run fails.
        type: number
        default: 1
      write_baseline:
        description: Save this run as the baseline artifact instead of comparing.
        type: boolean
        default: false
      bootstrap_baseline:
        description: First-release drift baseline, subject to separate acceptance before release
        type: boolean
        default: false
    outputs:
      saved_baseline:
        description: "'true' when this run saved a baseline instead of comparing (nothing was gated)."
        value: ${{ jobs.evaluate.outputs.saved_baseline }}

permissions:
  contents: read
  id-token: write

jobs:
  evaluate:
    if: inputs.run_evaluation
    concurrency:
      group: purchasing-agent-${{ inputs.agent_name }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: demo
    outputs:
      saved_baseline: ${{ steps.base.outputs.save }}
    defaults:
      run:
        shell: bash
        working-directory: sample
    env:
      AGENT_NAME: ${{ inputs.agent_name }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_AI_PROJECT_ID: ${{ vars.AZURE_AI_PROJECT_ID }}
      FOUNDRY_PROJECT_ENDPOINT: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
      DATASET_STEM: ${{ inputs.dataset }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Select comparison baseline
        id: base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          WRITE_BASELINE: ${{ inputs.write_baseline }}
          BOOTSTRAP_BASELINE: ${{ inputs.bootstrap_baseline }}
        run: |
          if [ "$BOOTSTRAP_BASELINE" = "true" ] && [ "$WRITE_BASELINE" != "true" ]; then
            echo "::error::First-release bootstrap must save a baseline."
            exit 1
          fi
          if [ "$WRITE_BASELINE" = "true" ]; then
            if [ "$BOOTSTRAP_BASELINE" = "true" ]; then
              if [ "$GITHUB_REF" != "refs/heads/main" ] || [ "$DATASET_STEM" != "approvers-drift" ] \
                || [ -e "evaluation/baselines/${DATASET_STEM}.json" ] \
                || { [ "$GITHUB_EVENT_NAME" != "push" ] && [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; }; then
                echo "::error::First-release bootstrap requires main and a missing drift baseline."
                exit 1
              fi
              reason="first-release drift baseline; acceptance required before release"
            elif [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
              echo "::error::Only a manual run may write a baseline."
              exit 1
            else
              reason="explicit baseline mode was requested"
            fi
            echo "save=true" >> "$GITHUB_OUTPUT"
            echo "reason=$reason" >> "$GITHUB_OUTPUT"
          else
            path="evaluation/baselines/${DATASET_STEM}.json"
            if [ -n "$BASE_SHA" ]; then
              baseline="$RUNNER_TEMP/comparison-baseline.json"
              if ! git show "${BASE_SHA}:sample/${path}" > "$baseline"; then
                echo "::error::No baseline at sample/${path} in the PR's base revision. Run the appropriate workflow in its explicit baseline mode, then review and commit the artifact."
                exit 1
              fi
            else
              baseline="$GITHUB_WORKSPACE/sample/${path}"
              if [ ! -f "$baseline" ]; then
                echo "::error::No baseline at sample/${path}. Run the appropriate workflow in its explicit baseline mode, then review and commit the artifact."
                exit 1
              fi
            fi
            echo "BASELINE_PATH=$baseline" >> "$GITHUB_ENV"
            echo "save=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check configuration
        run: |
          if [[ ! "$AGENT_NAME" =~ ^purchasing-advice-demo-(dev|pr-[0-9]+|check-[0-9]+)$ ]]; then
            echo "::error::Invalid evaluation agent name: $AGENT_NAME"
            exit 1
          fi
          for key in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID \
            AZURE_ENV_NAME AZURE_LOCATION AZURE_AI_PROJECT_ID FOUNDRY_PROJECT_ENDPOINT; do
            if [ -z "$(printenv "$key")" ]; then
              echo "::error::Missing GitHub variable: $key"
              exit 1
            fi
          done
          test -f "evaluation/datasets/${DATASET_STEM}.jsonl" \
            || { echo "::error::No dataset evaluation/datasets/${DATASET_STEM}.jsonl"; exit 1; }
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.11"
          python-version: "3.13"
          working-directory: sample
      - name: Install pinned evaluation dependencies
        run: |
          uv venv
          uv pip install --require-hashes -r requirements-dev.txt
      - name: Check baseline inputs without Azure
        if: steps.base.outputs.save != 'true'
        env:
          EVAL_DATASET: evaluation/datasets/${{ inputs.dataset }}.jsonl
        run: .venv/bin/python evaluation/evaluate.py --dry-run --baseline "$BASELINE_PATH" > /dev/null
      - uses: Azure/setup-azd@0b7e3a35ab00f2eee7080c845eb39c3f0ebfa553 # v2.4.0
        with:
          version: "1.35.0"
      - name: Install pinned Foundry extensions
        run: |
          azd extension install azure.ai.agents --version 1.0.0-beta.13
          azd extension install azure.ai.projects --version 1.0.0-beta.8
          azd extension install azure.ai.connections --version 1.0.0-beta.9  # app-insights connection service
      - name: Sign in with OIDC
        uses: Azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Configure existing project
        run: |
          azd config set auth.useAzCliAuth true
          azd env new "$AZURE_ENV_NAME" --subscription "$AZURE_SUBSCRIPTION_ID" \
            --location "$AZURE_LOCATION" --no-prompt
          azd env set AZURE_TENANT_ID "$AZURE_TENANT_ID"
          azd env set AZURE_AI_PROJECT_ID "$AZURE_AI_PROJECT_ID"
          azd env set FOUNDRY_PROJECT_ENDPOINT "$FOUNDRY_PROJECT_ENDPOINT"
          azd env set AGENT_NAME "$AGENT_NAME"
      - name: Check this is the first release
        if: inputs.bootstrap_baseline
        run: |
          .venv/bin/python - <<'PY'
          import os
          from azure.ai.projects import AIProjectClient
          from azure.core.exceptions import ResourceNotFoundError
          from azure.identity import DefaultAzureCredential

          with AIProjectClient(
              endpoint=os.environ["FOUNDRY_PROJECT_ENDPOINT"],
              credential=DefaultAzureCredential(),
          ) as project:
              try:
                  project.agents.get("purchasing-advice-demo-release")
              except ResourceNotFoundError:
                  print("No release agent exists; first-release bootstrap is allowed.")
              else:
                  raise SystemExit(
                      "A release agent already exists but its drift baseline is missing. "
                      "Commit the previously accepted baseline artifact before promoting again."
                  )
          PY
      - name: Deploy agent
        if: inputs.deploy_agent
        run: |
          # The pinned extension validates the name before expanding environment variables.
          yq -i '.services.purchasing-advice-demo.name = strenv(AGENT_NAME) |
            .services.purchasing-advice-demo.env.AGENT_NAME = strenv(AGENT_NAME)' azure.yaml
          azd deploy purchasing-advice-demo --no-prompt
      - name: Verify evaluation target
        if: inputs.deploy_agent
        run: |
          azd ai agent show purchasing-advice-demo --output json | python3 -c '
          import json, os, sys
          actual = json.load(sys.stdin)["name"]
          expected = os.environ["AGENT_NAME"]
          if actual != expected:
              raise SystemExit(f"Agent name mismatch: deployed {actual}, expected {expected}")
          print(f"Verified evaluation target: {actual}")
          '
      - name: Run ${{ inputs.dataset }}
        env:
          EVAL_DATASET: evaluation/datasets/${{ inputs.dataset }}.jsonl
          SAVE_BASELINE: ${{ steps.base.outputs.save }}
        run: |
          args=(--wait --report report.json --max-unscored "${{ inputs.max_unscored }}")
          if [ "$SAVE_BASELINE" != "true" ]; then
            args+=(--baseline "$BASELINE_PATH")
          fi
          if [ "${{ inputs.detail }}" = "counts" ]; then
            # Keep per-question detail and the report link out of the logs for the drift set.
            .venv/bin/python evaluation/evaluate.py "${args[@]}" > eval.log
          else
            .venv/bin/python evaluation/evaluate.py "${args[@]}"
          fi
      - name: Save as baseline
        if: steps.base.outputs.save == 'true'
        env:
          REASON: ${{ steps.base.outputs.reason }}
          DETAIL: ${{ inputs.detail }}
        run: |
          mkdir -p baseline-out
          cp report.json "baseline-out/${DATASET_STEM}.json"
          {
            echo "## New baseline: ${DATASET_STEM} (${REASON})"
            python3 - <<'PY'
          import json, os
          r = json.load(open("report.json"))
          print("| Judge | Passed | Average score | Not scored |\n| --- | --- | --- | --- |")
          for c in r["criteria"]:
              print(f"| {c['name']} | {c['passed']} / {c['total']} | {c['mean_score']:.3f} "
                    f"| {c.get('unscored', 0)} |")
          if os.environ.get("DETAIL") == "full" and r.get("report_url"):
              print(f"\n[Foundry report]({r['report_url']})")
          PY
            echo "Download the **baseline-${DATASET_STEM}** artifact and commit it as"
            echo "\`sample/evaluation/baselines/${DATASET_STEM}.json\`."
          } >> "$GITHUB_STEP_SUMMARY"
      # Must-pass rules don't need a baseline: even a run that saves one still blocks on a
      # failed must-pass row (comparing the run with itself means only those rules can fail).
      - name: Must-pass rows
        if: steps.base.outputs.save == 'true' && inputs.must_pass != ''
        run: |
          .venv/bin/python evaluation/compare_to_baseline.py --report report.json \
            --baseline report.json --tolerance 0 --must-pass ${{ inputs.must_pass }}
      - name: Upload baseline
        if: steps.base.outputs.save == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: baseline-${{ inputs.dataset }}
          path: sample/baseline-out/${{ inputs.dataset }}.json
          if-no-files-found: error
      - name: Compare with baseline
        if: steps.base.outputs.save != 'true'
        run: |
          set +e
          .venv/bin/python evaluation/compare_to_baseline.py \
            --report report.json \
            --baseline "$BASELINE_PATH" \
            --tolerance "${{ inputs.tolerance }}" \
            --must-pass ${{ inputs.must_pass }} > gate.txt
          status=$?
          cat gate.txt
          {
            echo "## ${DATASET_STEM}: $([ $status -eq 0 ] && echo passed || echo regression)"
            echo "Agent: \`${AGENT_NAME}\`"
            echo "Revision: \`${GITHUB_SHA}\`"
            echo '```'
            cat gate.txt
            echo '```'
            if [ "${{ inputs.detail }}" = "full" ]; then
              python3 -c "import json; print('Foundry report:', json.load(open('report.json')).get('report_url'))"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ $status -ne 0 ]; then
            if [ "${{ inputs.blocking }}" = "true" ]; then
              exit 1
            fi
            echo "::warning::${DATASET_STEM} regressed against its baseline (report only)."
          fi
